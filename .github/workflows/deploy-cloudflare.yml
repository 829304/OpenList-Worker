name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "api/**"
      - "gateway/anytls/**"
      - "scripts/fetch-frontend.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy gateway and OpenList
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test AnyTLS gateway
        working-directory: gateway/anytls
        run: |
          npm ci
          npm test
          npm run build

      - name: Verify 115 proxy integration
        run: >-
          pnpm exec tsx --test
          src/backend/drivers/115open/proxy.test.ts
          src/backend/server/raw_115_proxy.test.ts
          src/backend/server/proxy_request.test.ts
          src/backend/server/proxy_endpoint_gate.test.ts
          src/backend/server/raw_url_prefix.test.ts
          src/backend/internal/driver/proxy.test.ts

      - name: Fetch official frontend assets
        run: node scripts/fetch-frontend.mjs

      - name: Configure initial admin password
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$ADMIN_PASS" ]; then
            echo "ADMIN_PASS GitHub Actions secret is required for first-time admin initialization." >&2
            exit 1
          fi
          printf '%s' "$ADMIN_PASS" | pnpm exec wrangler secret put ADMIN_PASS

      # AnyTLS credentials and GATEWAY_TOKEN are existing Cloudflare Worker
      # Secrets. Deploying code preserves them; do not put them in this file.
      # Deploy the gateway first so a failed gateway update stops OpenList's update.
      - name: Deploy AnyTLS gateway
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.118.0"
          command: deploy --config gateway/anytls/wrangler.jsonc

      - name: Deploy OpenList Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.118.0"
          command: deploy
