name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "api/**"
      - "scripts/fetch-frontend.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch official frontend assets
        run: node scripts/fetch-frontend.mjs

      - name: Configure initial admin password
        env:
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$ADMIN_PASS" ]; then
            echo "ADMIN_PASS GitHub Actions secret is required for first-time admin initialization." >&2
            exit 1
          fi
          printf '%s' "$ADMIN_PASS" | pnpm exec wrangler secret put ADMIN_PASS

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.118.0"
          command: deploy
